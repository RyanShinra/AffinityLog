[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Run env.py for `alembic revision` too, not just for --autogenerate. Without this, a plain
# `alembic revision -m "..."` skips env.py entirely and falls back to a random hex id (e.g.
# 13f380988a90), silently bypassing the process_revision_directives hook there that numbers
# revisions sequentially (001, 002, ...). Cost: revision now needs the database reachable,
# because env.py opens a connection.
revision_environment = true
sqlalchemy.url = postgresql+asyncpg://affinitylog:affinitylog@localhost:5432/affinitylog

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

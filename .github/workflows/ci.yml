name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .
      - name: black
        run: black --check .
      # Everything, not just app/. It was `mypy app/` while the rest of the tree had errors
      # nobody had triaged; those are now cleared, so the narrower scope only bought us a gap
      # between what CI checks and what is true. `scripts/__init__.py` is what makes a root run
      # possible at all — without it mypy meets scripts/dump_schema.py under two module names.
      - name: mypy
        run: mypy .
      # The candidate_summary view is written down twice on purpose: sql/ is the copy you iterate
      # on, the migration is what actually runs. This fails the build if they define different
      # columns — i.e. the .sql changed without a new migration. Comments are ignored.
      - name: view / migration in sync
        run: python scripts/check_view_migration.py

  test:
    name: Tests (Postgres via testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing -v

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t affinitylog:ci .

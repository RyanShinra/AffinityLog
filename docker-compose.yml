services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: affinitylog
      POSTGRES_PASSWORD: affinitylog
      POSTGRES_DB: affinitylog
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affinitylog"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://affinitylog:affinitylog@db:5432/affinitylog
      DEBUG: "false"
    # Predicted structures are corpus data, not application code — same reason pg_data is a
    # volume. Mounted read-only so /demo/pdb/{id} can find them (the image does not carry
    # experiment_results/; the final stage copies only app/, migrations/, alembic.ini and
    # sample_data/), and so a new <id>_boltz2.pdb shows up without a rebuild.
    #
    # THE TARGET PATH IS COUPLED TO app/routers/demo.py AND NOTHING CHECKS IT.
    # That module computes _STRUCTURES_DIR as `Path(__file__).resolve().parents[2] /
    # "experiment_results"`, which lands on /app/experiment_results in the image (demo.py is at
    # /app/app/routers/demo.py) and on the repo root outside it. Move demo.py, or change where the
    # Dockerfile puts the package, and this mount points somewhere the code never looks — and the
    # symptom is a /demo page with no structures rather than an error, because both call sites
    # glob and an empty glob is a legal answer.
    #
    # Read-only because demo.py only globs and read_text()s. Nothing in the app writes here; the
    # corpus is written by the loader scripts, which run on the host.
    volumes:
      - ./experiment_results:/app/experiment_results:ro
    depends_on:
      db:
        condition: service_healthy
    # Run migrations then start the server
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pg_data:
